<!doctype html>
<!--
  Source of workshop/preview.jpg (1024x1024): an SVG firewall appliance in front of a burning shield,
  stopping malware on its incoming cable. No game assets. Same look as Next-Gen Hardware's preview.
  Render with headless Edge, then convert the PNG to preview.jpg:
    msedge --headless=new --disable-gpu --hide-scrollbars --window-size=1024,1024 --virtual-time-budget=3000 --screenshot=render.png file:///<path>/preview-scene.html
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #010204; }
  .canvas { position: relative; width: 1024px; height: 1024px; overflow: hidden; }
  svg { position: absolute; inset: 0; }
  .title {
    position: absolute; top: 40px; left: 0; right: 0; text-align: center;
    font-family: "Segoe UI Black", "Segoe UI", sans-serif; font-weight: 900;
    font-size: 126px; line-height: 0.96; letter-spacing: 1px; color: #fff;
    text-shadow: 0 0 28px rgba(255, 130, 40, 0.6), 0 0 4px rgba(255, 210, 160, 0.6), 0 6px 22px rgba(0, 0, 0, 0.9);
  }
  .title-rule {
    position: absolute; top: 296px; left: 50%; width: 420px; margin-left: -210px; height: 3px; border-radius: 2px;
    background: linear-gradient(90deg, transparent, #ffd9a8, transparent);
    box-shadow: 0 0 14px 3px rgba(255, 140, 40, 0.55);
  }
</style>
</head>
<body>

    <filter id="blur2"><feGaussianBlur stdDeviation="2"/></filter>

  <path d="M446 452 L 494 500 L 584 410" fill="none" stroke="#fff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

<script>
  // Flame tongues rising from behind the appliance (fixed values, so every render matches).
  const NS = "http://www.w3.org/2000/svg", BASE = 640;
  function tongues(id, list) {
    const g = document.getElementById(id);
    for (const [x, w, h, lean] of list) {
      const p = document.createElementNS(NS, "path");
      const l = x - w / 2, r = x + w / 2, tip = x + lean;
      p.setAttribute("d", `M${l} ${BASE} C ${l} ${BASE - h * 0.45} ${x - w * 0.12} ${BASE - h * 0.62} ${tip} ${BASE - h} ` +
                          `C ${x + w * 0.16} ${BASE - h * 0.58} ${r} ${BASE - h * 0.42} ${r} ${BASE} Z`);
      g.appendChild(p);
    }
  }
  tongues("flamesBack", [[352, 60, 80, 6], [392, 64, 128, -8], [440, 70, 150, 10], [490, 72, 170, -6],
                         [540, 72, 160, 8], [590, 70, 140, -10], [636, 64, 118, 6], [676, 60, 80, -4]]);
  tongues("flamesFront", [[372, 44, 62, 4], [414, 48, 92, -6], [462, 52, 112, 8], [512, 56, 126, -4],
                          [562, 52, 108, 6], [610, 48, 90, -8], [654, 44, 64, 4]]);
</script>
<div class="title">FIREWALL<br>FIX</div>
